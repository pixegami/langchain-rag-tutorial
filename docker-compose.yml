services:
  neo4j:
    image: neo4j:2026.10.2
    container_name: neo4j-database
    restart: unless-stopped

    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}

    ports:
      - "7474:7474"

    volumes:
      - neo4j_data:/data

    networks:
      - docker
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  symbolic-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symbolic-rag
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - docker
    depends_on:
      neo4j:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.symbolic-rag.rule=Host(`symbolic-rag.talkingdb.io`)"
      - "traefik.http.routers.symbolic-rag.entrypoints=websecure"
      - "traefik.http.routers.symbolic-rag.tls.certresolver=le"
      - "traefik.http.services.symbolic-rag.loadbalancer.server.port=8000"

volumes:
  neo4j_data:

networks:
  docker:
    external: true